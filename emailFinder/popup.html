<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 6px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      min-width: 250px;
      background-color: #fff;
      color: #222;
      user-select: none;
    }
    .header {
      padding: 6px 14px;
      font-weight: 600;
      color: #666;
    }
    .divider {
      height: 1px;
      background-color: #e0e0e0;
      margin: 4px 0;
    }
    .item {
      padding: 6px 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item:hover {
      background-color: #f0f0f0;
    }
    .item.disabled {
      color: #999;
      cursor: default;
    }
    .item.disabled:hover {
      background-color: transparent;
    }
    .status {
      font-size: 11px;
      color: #008000;
      display: none;
      padding: 4px 14px;
      background: #e8f5e9;
    }
  </style>
</head>
<body>
  <div id="status" class="status">Copiado para a área de transferência!</div>
  <div id="header" class="header">Carregando...</div>
  <div class="divider"></div>
  <div id="content"></div>
  <div class="divider"></div>
  <div id="btn-settings" class="item">Open Settings</div>
  <script src="popup.js"></script>
</body>
</html>
